<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Filmes - Guilherme Queiroz</title>
</head>
<body>
    <header class="topo">
        <h1>Catálogo de filmes<span class="assinatura">Guilherme Queiroz, turma 32TB</span></h1>
        <div class="acoes-topo">
            <div class="busca">
                <button class="botao-icone" type="button" id="botaoPesquisar" aria-label="Pesquisar filme" aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <input type="search" id="campoPesquisa" class="campo-busca" placeholder="Buscar por título ou gênero…" aria-label="Buscar filme">
            </div>
            <a class="botao botao-primario" href="cadastro.html">Cadastrar filme</a>
        </div>
    </header>

    <div class="carrossel">
        <button class="seta seta-anterior" type="button" aria-label="Filme anterior">&#8249;</button>
        <section class="filmes"></section>
        <button class="seta seta-proxima" type="button" aria-label="Próximo filme">&#8250;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
